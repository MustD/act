# Operator tasks for the web deployment. Each script loads .secure.env itself, for its own process only — a global
# [env] would put DIGITALOCEAN_TOKEN into every shell and into Gradle. See CLAUDE.md, "Deployment".
[tools]
terraform = "1.15.9" # inside versions.tf's "~> 1.15"

[tasks."infra:plan"]
description = "terraform plan"
run = "deploy/scripts/infra.sh plan"

[tasks."infra:apply"]
description = "terraform apply (by hand, never from a deploy)"
run = "deploy/scripts/infra.sh apply"

[tasks."deploy:build"]
description = "Build the act-web and act-relay images for act.version"
run = "deploy/scripts/build.sh"

[tasks."deploy:push"]
description = "Push act.version of both images; refuses an existing tag, never pushes latest"
run = "deploy/scripts/push.sh"

[tasks.deploy]
description = "Test, build, push and deploy act.version; `deploy <older-version>` redeploys that tag"
run = "deploy/scripts/deploy.sh"

[tasks."deploy:status"]
description = "What is running on the droplet"
run = "deploy/scripts/status.sh"
