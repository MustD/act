# Every command in this repo is a mise task; these are the only place a Gradle command line is written down, so the
# deploy scripts and the docs name tasks, not `./gradlew`. See CLAUDE.md, "Commands".
#
# mise loads the env files per task — never a global [env] — so DIGITALOCEAN_TOKEN reaches only the infra and deploy
# tasks, not Gradle or an interactive shell. See CLAUDE.md, "Deployment".
#   .secure.build.env   MAL_CLIENT_ID, DOCKERHUB_USER   (run:desktop*, run:web*, build*, deploy, deploy:build, deploy:push)
#   .secure.device.env  ANDROID_SERIAL   (run:android)
#   .secure.deploy.env  DIGITALOCEAN_TOKEN, AWS_* (state bucket), EDGE_SSH, TF_VAR_*   (infra:*, deploy, deploy:status)
# The test tasks load neither: a test must pass the same with or without a Client ID. (The two that `deploy` runs
# inherit its build env, Client ID included — lib.sh's `task` strips only the deploy secrets.)
#
# Not managed here: docker (with buildx) and ssh, which the deploy tasks expect on the machine.
[tools]
# The JDK Gradle runs on. Nothing downloads one any more — gradle-daemon-jvm.properties names the same vendor and
# version and has no toolchain URLs — so a different JDK fails the build rather than being replaced.
java = "zulu-21"
terraform = "1.15.9" # inside versions.tf's "~> 1.15"

# --- run locally -------------------------------------------------------------------------------------------------

[tasks."run:desktop"]
description = "Desktop app, with the Client ID from .secure.build.env"
env = { _ = { file = ".secure.build.env" } }
run = "./gradlew :app:desktopApp:run"

[tasks."run:desktop:hot"]
description = "Desktop app with Compose Hot Reload"
env = { _ = { file = ".secure.build.env" } }
run = "./gradlew :app:desktopApp:hotRun --auto"

[tasks."run:server"]
description = "Ktor relay on :18010"
run = "./gradlew :server:run"

[tasks."run:web"]
description = "Web dev server on :18020, no live reload (needs run:server too)"
env = { ACT_WEB_HOT = "0", _ = { file = ".secure.build.env" } }
run = "./gradlew :app:webApp:wasmJsBrowserDevelopmentRun --continuous"

[tasks."run:web:hot"]
description = "Web dev server on :18020 with live reload (needs run:server too)"
env = { _ = { file = ".secure.build.env" } }
run = "./gradlew :app:webApp:wasmJsBrowserDevelopmentRun --continuous"

# --- build -------------------------------------------------------------------------------------------------------

[tasks.build]
description = "Everything: every target compiled and every test run"
env = { _ = { file = ".secure.build.env" } }
run = "./gradlew build"

[tasks."build:android"]
description = "Android debug APK"
env = { _ = { file = ".secure.build.env" } }
run = "./gradlew :app:androidApp:assembleDebug"

[tasks."build:android:release"]
description = "Signed, minified Android App Bundle; needs .secure.release.env"
env = { _ = { file = [".secure.build.env", ".secure.release.env"] } }
run = "./gradlew :app:androidApp:bundleRelease"

[tasks."build:web"]
description = "Development Wasm bundle, no server; build:web:dist is the production one"
env = { _ = { file = ".secure.build.env" } }
run = "./gradlew :app:webApp:wasmJsBrowserDevelopmentWebpack"

[tasks."build:web:dist"]
description = "Production Wasm bundle; fails without a Client ID"
env = { _ = { file = ".secure.build.env" } }
run = "./gradlew :app:webApp:wasmJsBrowserDistribution"

[tasks."build:server:dist"]
description = "The relay's installDist, the act-relay image's build context"
env = { _ = { file = ".secure.build.env" } }
run = "./gradlew :server:installDist"

[tasks."generate:mal-config"]
description = "Only :core's generateMalBuildConfig, for the by-hand cache check in core/build.gradle.kts"
run = "./gradlew :core:generateMalBuildConfig"

# --- test --------------------------------------------------------------------------------------------------------

[tasks.test]
description = "Every test task below, in one Gradle invocation"
run = "./gradlew :core:allTests :app:shared:jvmTest :app:shared:testAndroidHostTest :app:shared:wasmJsTest :app:androidApp:testDebugUnitTest :server:test"

[tasks."test:core"]
description = ":core on jvm, wasmJs and android"
run = "./gradlew :core:allTests"

[tasks."test:shared:jvm"]
description = ":app:shared jvmTest + commonTest"
run = "./gradlew :app:shared:jvmTest"

[tasks."test:shared:android"]
description = ":app:shared androidHostTest + commonTest"
run = "./gradlew :app:shared:testAndroidHostTest"

[tasks."test:shared:web"]
description = ":app:shared webTest + commonTest"
run = "./gradlew :app:shared:wasmJsTest"

[tasks."test:android"]
description = ":app:androidApp — the manifest drift guard, and nothing else"
run = "./gradlew :app:androidApp:testDebugUnitTest"

[tasks."test:server"]
description = ":server"
run = "./gradlew :server:test"

[tasks."test:one"]
description = "One test class or method: `test:one <suite> <filter>`, on that suite's JVM-hosted test task"
usage = """
arg "<suite>" help="Which module's JVM-hosted tests to run" {
  choices "core" "shared" "server" "android"
}
arg "<filter>" help="Class or method pattern, e.g. '*.SignInTest' or '*.SignInTest.some_method'"
"""
run = """
case "$usage_suite" in
  core)    task=:core:jvmTest ;;
  shared)  task=:app:shared:jvmTest ;;
  server)  task=:server:test ;;
  android) task=:app:androidApp:testDebugUnitTest ;;
esac
./gradlew "$task" --tests "$usage_filter"
"""

# --- infrastructure ----------------------------------------------------------------------------------------------

[tasks."infra:plan"]
description = "terraform plan"
env = { _ = { file = ".secure.deploy.env" } }
run = "deploy/scripts/infra.sh plan"

[tasks."infra:apply"]
description = "terraform apply (by hand, never from a deploy)"
env = { _ = { file = ".secure.deploy.env" } }
run = "deploy/scripts/infra.sh apply"

# --- build and deploy --------------------------------------------------------------------------------------------

[tasks."deploy:build"]
description = "Build the act-web and act-relay images for act.version"
env = { _ = { file = ".secure.build.env" } }
run = "deploy/scripts/build.sh"

[tasks."deploy:push"]
description = "Push act.version of both images; refuses an existing tag, never pushes latest"
env = { _ = { file = ".secure.build.env" } }
run = "deploy/scripts/push.sh"

[tasks.deploy]
description = "Test, build, push and deploy act.version; `deploy <version>` redeploys that pushed tag"
env = { _ = { file = [".secure.build.env", ".secure.deploy.env"] } }
run = "deploy/scripts/deploy.sh"

[tasks."deploy:status"]
description = "What is running on the droplet"
env = { _ = { file = ".secure.deploy.env" } }
run = "deploy/scripts/status.sh"
